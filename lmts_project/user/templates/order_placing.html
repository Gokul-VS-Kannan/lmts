{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/order_placing.css' %}">
    <title>Document</title>
</head>
<body>
    <!-- navbar creation -->
    
    <div> 
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <!-- Navbar content  -->
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'images/truckgreyIco.png' %}" class="logo">LMTS
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="user_dash"> Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="usercon"> Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="userabt">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="userlogout"> Logout</a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>
    </div> 
    <p class="head">SHIPPING DETAILS</p>
    <div class="container">
        <div class="row">
            <form action="orderplacing" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Material for Shipping :</label>
                    <input type="text" class="form-control" name="item"placeholder="Material" required>
                </div> 
                <div class="mb-3">
                    <label class="form-label">Quantity In Kilograms:</label>
                    <input type="text" class="form-control" name="quantity"placeholder="Quantity" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Shipping From Address:</label>
                    <textarea type="text" class="form-control" name="fromaddress" row="4" placeholder="Please Enter The Address" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Shipping To Address:</label>
                    <textarea type="text" class="form-control" name="toaddress" row="4" placeholder="Please Enter The Address" required></textarea>
                </div>
                <div class="mb-3">
                    <label  class="form-label">Date of Shipping:</label>
                    <input type="date" class="form-control" name="orderdate"placeholder="Date Of Order" required>
                </div>
                <div class="mb-3">
                    <label  class="form-label">Date of Delivery:</label>
                    <input type="date" class="form-control" name="deldate"placeholder="Date Of Delivery" required>
                </div>
                <!-- check box for verifing  -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Please make sure that the details entered are correct</label>
                </div>
                <!-- creating button for registration  -->
                <input type="submit" class="btn btn-outline-success"value="Submit Order">
            </form>
        </div>
    </div>
    <!-- script for bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
