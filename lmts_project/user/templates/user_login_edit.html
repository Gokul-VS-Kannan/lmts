{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/user_login.css' %}">
    <title>Login Page</title>
</head>
<body>
    <!-- signup page -->
    <div class="container">
        <form class="form-group" action="editlogin" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="uname" placeholder="username">
            </div>
            <div class="mb-3">
                <label  class="form-label">Password</label>
                <input type="password" class="form-control" name="pwd" placeholder="password">
            </div>
            <button type="submit" value="update" class="btn btn-danger">Update</button>
        </form>
    </div>
    <br>
    <marquee behavior="scroll" direction="left">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
    </marquee>
    <!-- script for bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
