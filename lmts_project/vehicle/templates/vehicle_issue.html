{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/vehicle_issue.css' %}">
    <title>Document</title>
</head>
<body>
    <!-- navbar creation -->
    <div> 
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <!-- Navbar content  -->
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'images/truckgreyIco.png' %}" class="logo">LMTS
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'driver:driver_dash' %}"> Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'driver:driv_contact' %}"> Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'driver:driv_about' %}">About Us </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'driver:drivlogout' %}"> Logout</a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>
    </div> 
    <marquee>
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
        <img src="{% static 'images/truckgreyIco.png' %}">
    </marquee>
    <!-- creating forms for reporting vehicle issue -->
    <div class="container">
        <div class="row">
            <form action="vehicleissue" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Vehicle id:</label>
                    <input type="text" class="form-control" name="veid"placeholder="Vehicle id" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Report Issue:</label>
                    <input type="text" class="form-control" name="issue"placeholder="Report Issue" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date of Report Issue:</label>
                    <input type="date" class="form-control" name="idate"placeholder="Date of Report Issue" required>
                </div>
                <!-- creating button   -->
                <input type="submit" class="btn btn-outline-success"value="Submit">
            </form>
        </div>
    </div>
    <!-- script for bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
