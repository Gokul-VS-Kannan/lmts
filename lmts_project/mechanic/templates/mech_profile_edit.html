{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/mech_profile_edit.css' %}">
    <title>Edit Your Profile</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <form action="editmech" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Full Name:</label>
                    <input type="text" class="form-control" name="name"placeholder="Full Name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Profile Picture:</label>
                    <input type="file" accept="image/*" class="form-control" name="Image"placeholder="Choose Image" >
                </div>
                <div class="mb-3">
                    <label class="form-label">Age:</label>
                    <input type="text" class="form-control" name="age" placeholder="Age">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone number:</label>
                    <input type="text" class="form-control" name="num" placeholder="Phone Number">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email id:</label>
                    <input type="email" class="form-control" name="email" placeholder="Email id">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address:</label>
                    <textarea type="text" class="form-control" name="address" row="4" placeholder="Please Enter The Address" ></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Skill:</label>
                    <textarea type="text" class="form-control" name="skill" row="4" placeholder="Skill" ></textarea>
                </div>
                
                <!-- check box for verifing  -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Please make sure that the details entered are correct</label>
                </div>
                <!-- creating button for registration  -->
                <input type="submit" class="btn btn-outline-success"value="Update">
            </form>
        </div>
    </div>

    <!--   script tag for bootstrap   -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
