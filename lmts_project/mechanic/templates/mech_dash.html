{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/mech_dash.css' %}">
    <title>Mechanic Home</title>
</head>
<body>
    <!-- navbar creation -->
    <div> 
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <!-- Navbar content  -->
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'images/truckgreyIco.png' %}" class="logo">LMTS
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="mech_dash"> Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="mech_contact"> Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="mech_about">About Us </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="mechlogout"> Logout</a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>
    </div> 
    <!-- crating multiple buttons -->
    <div class="container">
        <div class="set">
            <form action="mechprofile" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">View Profile</button>
            </form>
            <form action="mecheditprofile" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Edit Profile</button>
            </form>
            <form action="mechusername" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Edit Username & Password</button>
            </form>
            <form action="mechstat" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Mechanic Status</button>
            </form>
            <form action="mechserv" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Service Request </button>
            </form>
            <form action="acpt_serv" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Accepted Service</button>
            </form>
            <form action="serv_rec" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Service Record</button>
            </form>
            <form action="mechdelete" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success equal-width-btn">Delete Profile</button>
            </form>
        </div>
       
    </div>
    <!-- script for bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
